name: Update Mortgage Rates & Market Data

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 14:00 UTC (10am ET)
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch mortgage rates from FRED API
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "ERROR: FRED_API_KEY secret is not set."
            exit 1
          fi

          fetch_rate() {
            local series=$1
            local tmpfile
            tmpfile=$(mktemp)
            local curl_exit=0
            local http_code

            # Capture exit code, HTTP status, and body separately
            http_code=$(curl -s -w "%{http_code}" -o "$tmpfile" \
              "https://api.stlouisfed.org/fred/series/observations?series_id=${series}&api_key=${FRED_API_KEY}&sort_order=desc&limit=1&file_type=json" \
              2>/dev/null) || curl_exit=$?

            local response
            response=$(cat "$tmpfile" 2>/dev/null || echo "")
            rm -f "$tmpfile"

            echo "DEBUG [${series}]: curl_exit=${curl_exit}, http_code=${http_code}, body_len=${#response}" >&2
            if [ -n "$response" ]; then
              echo "DEBUG [${series}]: body_preview=${response:0:300}" >&2
            fi

            if [ "${curl_exit}" -ne 0 ]; then
              echo "ERROR: curl network failure (exit code ${curl_exit}) for series ${series}" >&2
              echo "       Possible causes: DNS failure, connection refused, TLS error" >&2
              exit 1
            fi

            if [ -z "$response" ]; then
              echo "ERROR: Empty HTTP ${http_code} response for series ${series}" >&2
              exit 1
            fi

            echo "$response" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              if 'error_message' in d:
                  print('FRED API error: ' + d['error_message'], file=sys.stderr)
                  sys.exit(1)
              obs = d.get('observations', [])
              if not obs:
                  print('FRED API returned no observations for series', file=sys.stderr)
                  sys.exit(1)
              val = obs[0]['value']
              if val == '.':
                  print('FRED: no data yet for this series (value is \".\")', file=sys.stderr)
                  sys.exit(1)
              print(val)
          except Exception as e:
              print('Failed to parse FRED response: ' + str(e), file=sys.stderr)
              sys.exit(1)
          "
          }

          echo "Fetching 30-year rate..."
          RATE_30=$(fetch_rate "MORTGAGE30US")
          echo "30yr rate: $RATE_30"
          echo "Fetching 15-year rate..."
          RATE_15=$(fetch_rate "MORTGAGE15US")
          echo "15yr rate: $RATE_15"
          echo "Fetching 5/1 ARM rate..."
          RATE_5=$(fetch_rate "MORTGAGE5US")
          echo "5/1 ARM rate: $RATE_5"

          TODAY=$(date -u +%Y-%m-%d)

          python3 - "$RATE_30" "$RATE_15" "$RATE_5" "$TODAY" <<'PYEOF'
          import sys, json

          rate_30, rate_15, rate_5, today = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]

          with open('data/mortgage-rates.json') as f:
              existing = json.load(f)

          data = {
              "updated": today,
              "source": "Freddie Mac Primary Mortgage Market Survey via FRED",
              "rates": {
                  "rate_30yr": float(rate_30),
                  "rate_15yr": float(rate_15),
                  "rate_5arm": float(rate_5)
              },
              "market": existing.get("market", {}),
              "note": "Auto-updated weekly by GitHub Actions. Market data for Albany County/Capital Region NY."
          }

          with open('data/mortgage-rates.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f"Updated rates: 30yr={rate_30}, 15yr={rate_15}, 5/1ARM={rate_5}")
          PYEOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mortgage-rates.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: mortgage rates $(date -u +%Y-%m-%d)"
            git push
          fi
