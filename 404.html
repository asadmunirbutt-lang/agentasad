  <title>Page Not Found | Agent Asad Realtor</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script>
    (function() {
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);

      // Case 1: .html extension → strip and redirect to clean URL
      if (path.endsWith('.html')) {
        var clean = path.replace(/\.html$/, '/');
        window.location.replace(clean);
        return;
      }

      // Case 2: nested path like /page-a/page-b or /page-a/license/texas
      // Strip first segment, redirect to remainder
      if (segments.length >= 2) {
        // Known top-level pages — if last segment matches, redirect there
        var known = ['contact','about-us','blog','buyers-guide','sellers-guide','home-valuation',
          'mortgage-calculator','first-time-buyer-programs','closing-costs-guide','market-report',
          'school-districts','faq','testimonials','areas-served','relocation-guide',
          'realtor-listings','zillow-listings','new-construction','investment-properties',
          'open-houses','live-market','mock-exam','real-estate-license-exam','latham-ny-real-estate',
          'colonie-ny-homes-for-sale','albany-ny-realtor'];

        // If path is /x/license/state → redirect to /license/state/
        if (segments.length >= 3 && segments[segments.length - 2] === 'license') {
          window.location.replace('/license/' + segments[segments.length - 1] + '/');
          return;
        }
        // If path is /x/posts/slug or /posts/something/something
        if (segments.length >= 3 && (segments[0] === 'posts' || segments[segments.length - 2] === 'posts')) {
          window.location.replace('/posts/' + segments[segments.length - 1] + '/');
          return;
        }
        // 2-level path: strip first, go to second segment
        if (segments.length === 2) {
          var dest = '/' + segments[1] + '/';
          window.location.replace(dest);
          return;
        }
        // 3+ levels: strip first, keep rest
        if (segments.length >= 3) {
          var dest = '/' + segments.slice(1).join('/') + '/';
          window.location.replace(dest);
          return;
        }
      }
    })();
  </script>
</head>
